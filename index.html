<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cache-busting: HTML must NEVER be cached, so users always pick up new asset hashes -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Canal do Brito - Agenda Esportiva, Filmes e Séries</title>
    <meta name="description" content="Acompanhe a agenda esportiva do dia: Futebol, NBA, CS2, Tênis e UFC, além de sugestões de filmes e séries. Tudo em um só lugar, ao vivo e atualizado.">
    <meta name="author" content="Brito Solutions TV" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&display=swap"></noscript>

    <link rel="canonical" href="https://canaldobrito.site/" />

    <!-- hreflang -->
    <link rel="alternate" hreflang="pt-BR" href="https://canaldobrito.site/" />
    <link rel="alternate" hreflang="x-default" href="https://canaldobrito.site/" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Canal do Brito",
      "alternateName": "CanaldoBrito",
      "url": "https://canaldobrito.site/",
      "logo": "https://canaldobrito.site/pwa-512x512.png",
      "description": "Acompanhe a agenda esportiva do dia, filmes e séries em um só lugar.",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://canaldobrito.site/"
      },
      "sameAs": [
        "https://www.instagram.com/canaldobrito"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Canal do Brito",
      "alternateName": "CanaldoBrito",
      "url": "https://canaldobrito.site/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://canaldobrito.site/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "pt-BR"
    }
    </script>

    <!-- Open Graph (WhatsApp, Facebook, Telegram, iMessage, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canal do Brito" />
    <meta property="og:url" content="https://canaldobrito.site/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Canal do Brito - Agenda Esportiva, Filmes e Séries" />

    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:determiner" content="o" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/CBtJ5hWstpQNOL94TuD5N8LmpqD2/social-images/social-1778721619091-imagem_social_canal_do_brito.webp" />
    <meta property="og:image:secure_url" content="https://storage.googleapis.com/gpt-engineer-file-uploads/CBtJ5hWstpQNOL94TuD5N8LmpqD2/social-images/social-1778721619091-imagem_social_canal_do_brito.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Canal do Brito — Agenda Esportiva, Filmes e Séries" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canal do Brito - Agenda Esportiva, Filmes e Séries" />
    <meta name="twitter:description" content="Agenda esportiva do dia + filmes e séries. Ao vivo e atualizado." />

    <meta name="theme-color" content="#07080a" />
  </head>

  <body>
    <div id="root">
      <!-- Splash screen — removed automatically when React mounts -->
      <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07080a;">
        <img src="/pwa-192x192.png" alt="" width="96" height="96" style="animation:splash-pulse 1.6s ease-in-out infinite;">
        <p style="margin-top:20px;font-family:system-ui,sans-serif;font-size:14px;color:#ffffff99;letter-spacing:0.05em;">Carregando…</p>
      </div>
      <style>
        @keyframes splash-pulse{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
