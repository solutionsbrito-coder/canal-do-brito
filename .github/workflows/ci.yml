name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Run unit tests
        run: bun run test

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - "iPhone 13 (WebKit)"
          - "Pixel 5 (Chromium)"
          - "Pixel 7 (Chromium)"
          - "Galaxy S9+ (Chromium)"
          - "Galaxy Tab S4 (Chromium)"
          - "Desktop Chrome"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers + system deps
        run: bunx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        env:
          CI: "true"
        run: bunx playwright test --config=playwright.ci.config.ts --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  android-smoke:
    name: Android smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    strategy:
      fail-fast: true
      matrix:
        project:
          - "Pixel 5 (Chromium)"
          - "Pixel 7 (Chromium)"
          - "Galaxy S9+ (Chromium)"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run modal specs on Android profile
        env:
          CI: "true"
        run: bunx playwright test --config=playwright.ci.config.ts --project="${{ matrix.project }}" e2e/modals.spec.ts e2e/modals.rotation.spec.ts e2e/modals.swipe.spec.ts
      - name: Upload Android report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  perf-budget:
    name: Perf budget (modais)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run perf spec (Pixel 5)
        env:
          CI: "true"
        run: bunx playwright test --config=playwright.ci.config.ts --project="Pixel 5 (Chromium)" e2e/modals.perf.spec.ts
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report
          path: playwright-report/
          retention-days: 14
